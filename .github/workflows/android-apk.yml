name: Gerar APK Popular

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android-wrapper/**'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        working-directory: android-wrapper
        run: gradle assembleDebug --no-daemon
      - name: Preparar APK
        run: cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk Popular-v1.0.0.apk
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Popular-v1.0.0-APK
          path: Popular-v1.0.0.apk
          retention-days: 90
